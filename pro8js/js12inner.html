<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>

    <script>
        function func1(){ // 처리1에 대한 함수
            // alert("a");

            // 1. name을 tag로 잡음
            // let str1 = document.getElementsByName("t1")[0].innerHTML;
            // console.log(str1)
            // name은 복수 개가 올 수 있기 때문에 name tag를 가진 t1이 배열의 형태로 적어준다. 그래서 index를 적어주어야 한다.
            // body 영역 내의 특정 name을 선택
            // name이 t1인 태그(innerHTML)를 잡아서 innerHTML을 수행한다.
            
            // 2. id를 tag로 잡음
            // let str1 = document.getElementById("test1").innerHTML;
            // console.log(str1);
            // body 영역 내의 특정 id를 선택

            // 3. 최근 방법 : 특정 element 값 얻기
            // 3-1. innerHTML ... 이렇게 quertSelector로 쓰면 id와 name 모두 받을 수 있다.
            let str1 = document.querySelector("#test1").innerHTML; // html tag까지
            // #test1 = id를, .test1 = 클래스를 의미한다
            
            // 3-2. innerText
            //let str1 = document.querySelector("#test1").innerText;    // html만 
            // HTML과 달리 tag없이 순수 text만 선택된다.

            // 3-3. 값을 특정 element에 적용
            document.querySelector("#show1").innerHTML = str1;
            
            let tag1 = "이름 : <input type = 'text' name = 'irum'>";
            let tag2 = "나이 : <input type = 'text' name = 'nai'>";
            document.querySelector("#test1").innerHTML = tag1 + "<br>" + tag2
            // id가 test1인 녀셕에게 tag1 + <br> + tag2를 줄 것이다.
            // 이건 client내에서만 발생하고 server에서는 모른다.
            // innerHTML이 이름, 나이 칸으로 바뀐다.
            // 새로고침 버튼이 깜빡거림 = 내가 요청한 문서가 web server로 가서 그 값을 덮어씌운다.
            

            // body tag 영역 내의 특정 id를 Selector로 선택 = css의 선택자를 흉내낸 방식

            // 이렇게 주로 3가지 방식을 이용하여 (이름, id, selector) 의 innerHTML값을 읽어줄 수 있다
            
        }

        function func2(){ // 처리2에 대한 함수
            // alert("b");

            // 1. innerHTML
            let str2 = document.querySelector("#test2").innerHTML;
            // 이렇게도 쓸 수 있고
            console.log(str2);

            document.querySelector("#show2").innerHTML = str2; 
            // 이렇게 쓸 수도 있다.
            // 태그를 해석

            // 2. innerText 
            document.querySelector("#show3").innerText = str2; 
            // 전체를 문자열로 받아들인다

        }

    </script>
</head>
<body>
    <pre>
        DOM을 이용하면 -> 실행 중, tag의 생성 / 수정 / 삭제 or 데이터 참조 / 추가 / 수정 / 삭제 처리 가능
        element.innetText : element 안의 text 값들만 대상으로 정리
        element.innerHTML : element 안의 text 뿐만 아니라 HTML이나 XML을 대상으로 처리
        가장 큰 차이 : HTML 태그를 해석하느냐, 그냥 글자로 보느냐야.

    </pre>

    <hr>
    <div id = "test1" name = "t1"><h2> innerHTML 연습 </h2></div>
    <!--div / id / name element 요소 중 하나를 getElementsByName을 이용해서 처리할 수 있다.-->
    <div id = "test2"><h1> 안녕하세요 </h1></div>

    <button onclick = "func1()"> 처리1 </button>
    <button onclick = "func2()"> 처리2 </button>
    <br>

    <div id = "show1"> 출력1 </div>
    <div id = "show2"> 출력2 </div>
    <div id = "show3"> 출력3 </div>


</body>
</html>
