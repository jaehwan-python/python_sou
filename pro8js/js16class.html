<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function objTest(){
            // alert("a")
            let str = ""

            // 1. new Object()를 이용하여 객체를 생성한 경우 : 빈 객체를 먼저 만들고, 나중에 멤버를 하나씩 추가한 방식
            let person1 = new Object(); // 객체가 생성되었다.

            // 1-1.속성 : 멤버 필드(변수)
            person1.IRUM = "한가해";
            person1.nai = 33;
            person1.juso = "서울";

            // 1-2.속성 : 멤버 메서드(메서드) : 메서드 명 = info
            person1.info = function(){
                return `${this.IRUM}님의 나이는, ${this.nai}살, 사는 곳은 ${this.juso}`;
            }
            // info는 멤버 메서드의 이름이다.
            // this는 현재 현재 자신이 있는 클래스 person1을 가리킨다.

            // 1-3.멤버 호출
            str += "<h3>1. new Object()를 사용</h3>";
            str += `이름 : ${person1.irum}<br>` // 멤버 필드 호출
            str += `나이 : ${person1.nai}<br>`
            str += `주소 : ${person1.juso}<br>`
            str += `info 메서드 : ${person1.info()}<br>` // 멤버 메서드 호출

            // 1-4. 실행
            document.getElementById("disp").innerHTML = str;
            // id = "disp"인 태그를 찾아서 그 요소 내부에 str내용을 HTML로 넣어라


            // 2. 생성자 함수를 이용하여 객체를 생성한 경우 : 생성자 함수를 하나 만들어서, 객체를 찍어내는 틀처럼 사용한 방식
            function Person(irum, nai, juso){

            // 2-1. 멤버 필드(변수)
                this.irum = irum;
                this.nai = nai;
                this.juso = juso;

            // 2-2. 멤버 메서드
                this.info = function(){
                    return `${this.irum}씨의 나이는 ${this.nai}세, 사는 곳은 ${this.juso}`;
                }
            }

            // 2-3. 멤버호출
            let person2 = new Person("김칫국", 30, "평택");
            str += "<h3>2. 생성자를 사용</h3>";
            str += `이름 : ${person2.irum}<br>` // 멤버 필드 호출
            str += `나이 : ${person2.nai}<br>`
            str += `주소 : ${person2.juso}<br>`
            str += `info 메서드 : ${person2.info()}<br>` // 멤버 메서드 호출

            // 2-4. 실행
            document.getElementById("disp").innerHTML = str;


            // 3. 객체 literal 이용한 객체 생성 : 객체를 선언하면서 멤버변수와 메서드를 한 번에 전부 작성한 방식 
            let person3 = {

            // 3-1. 멤버 필드
            irum:"한송이",
            nai:27,
            juso:"수원",

            // 3-2. 멤버 메서드
            info: function(){
                return `${this.irum}씨의 나이는 ${this.nai}세, 사는 곳은 ${this.juso}`;
                }
            }
            // 3-3. 멤버 호출
            str += "<h3>2. 생성자를 사용</h3>";
            str += `이름 : ${person3.irum}<br>` // 멤버 필드 호출
            str += `나이 : ${person3.nai}<br>`
            str += `주소 : ${person3.juso}<br>`
            str += `info 메서드 : ${person3.info()}<br>` // 멤버 메서드 호출
            // 만약+=를 안쓰고 =을 쓰면 그냥 계속 갚을 덮어씌운다
            // stt1,2,3, 이런식으로 적어도 된다.
            
            // 3-4. 실행
            document.getElementById("disp").innerHTML = str;
        }
        // 이렇게 3가지 방법으로 class를 사용하는 경우에 대해 알아보았다.

    </script>
</head>
<body>
    <pre>
    클래스는 객체를 만들기 위한 설계도이고, 객체는 클래스를 이용해 실제로 성한 데이터이다
    자바스크립트에서 class와 객체를 가장 쉽게 이해하는 방법은 "설계도와 실제 물건"으로
            class -> 설계도
            object -> 설계도로 만든 대상
    </pre>

    <h2>JavaScript 객체 생성 방법 중 주요 3가지</h2>
    <button onclick = "objTest()">객체 생성 및 출력</button>

    <br>

    <div id = "disp"></div>


</body>
</html>
