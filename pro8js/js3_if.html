     // 파이썬에서는 문자열들을 이어서 나열할 때 ,를 썼지만 js에서는 +로 문자열들의 나열을 이어붙여준다

    <br><h3>**조건 판단문 switch(key)**<h3><br>
    <script>
        let result = "B" // 학점 기억 변수

        switch(result){ // 파이썬, c는 들여쓰기로 자신의 영역을 확보하지만 javascript는 {}자기의 영역을 지정한다.
        case "A": {
            document.write("매우우수")
            document.write("good")
            break; // break를 통해 case A 탈출
        }
        case "B": document.write("우수"); break;
        case "C": document.write("보통"); break;
        case "D":                               // 아무것도 없으면 그냥 흘러 내려와서 '불량'이나 '기타'가 나오게 된다.
        case "F": document.write("불량"); break;
        default:document.write("기타");
    }
    </script>
