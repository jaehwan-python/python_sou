<body>

    <h2>핵심 포인트</h2>

    <ul>
        <li>팔보다 등 근육으로 당긴다는 느낌을 가집니다.</li>
        <li>가슴을 살짝 들어 올립니다.</li>
        <li>어깨가 과도하게 올라가지 않도록 합니다.</li>
        <li>운동 동작을 천천히 수행합니다.</li>
        <li>등 근육이 수축하는 것을 느끼면서 운동합니다.</li>
    </ul>
