    <title>어깨 운동 핵심 포인트</title>
</head>

<body>

    <h2>핵심 포인트</h2>

    <ul>
        <li>어깨에 무리가 가지 않는 무게를 사용합니다.</li>
        <li>반동을 사용하지 않습니다.</li>
        <li>덤벨을 너무 빠르게 올리거나 내리지 않습니다.</li>
        <li>어깨 근육의 수축을 느끼면서 운동합니다.</li>
        <li>올바른 자세와 가동 범위를 유지합니다.</li>
    </ul>

</body>
