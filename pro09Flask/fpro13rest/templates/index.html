<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--css(style.css)불러오기-->
    
    <!--방법1(옛날방법)-->
    <!--<link rel="stylesheet" href="/static/css/style.css">-->

    <!--방법2(요즘방법)-->
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <!--index.html은 우리가 따로 파일로 만들어둔 css파일을 불러와서 사용한다 = External방식-->

    <!--get 요청이라는 버튼을 눌러도 아무 동작을 안하기에 javascript를 이용해서 동작을 넣어줄 것이다-->
    <script src="{{url_for('static', filename = 'js/app.js')}}" defer></script>
    <!--원래 자바스크립트는 바디영역에서 썼다. 하지만 W3C는 body영역에 자바스크립트를 사용하는 것을 비선호한다.
    서버가 보낸 html자료에 javascript있다. 일반적으로는 브라우저 엔진이 모든 html을 읽고 수행하지만 
    html에 defer가 있으면 javascript를 제일 먼저 읽고 나서 수행하게 된다
    그러니 defer를 습관적으로 써주자-->
</head>
<body>

    <h2> Flask REST API + Ajax(fetch방법) : "GET" </h2>
    
    <div>
        <div>
            <label for = "name"> 이름 </label>
            <!--for가 id와 일치된다-->
            <input type = "text" id = "name" value = "길동" />
            <!--input의 value는 초기값을 의미한다-->
        </div>
        <div>
            <label for = "age"> 나이 </label>
            <input type = "number" id = "age" min = "0" value = "23" />
            <!--input의 value는 초기값을 의미한다-->
        </div>
        <button id = "sendBtn"> GET 요청 </button>
    </div>
    <br>
    <div id = "result"> 결과출력 </div>

</body>
</html>
