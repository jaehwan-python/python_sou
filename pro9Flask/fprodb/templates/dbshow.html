<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> 직원 자료, 직급별 연봉 통계 </h2>
    <br>
    <a href = "/"> 메인 페이지 </a>
    <br>

    <form action ="/dbshow" method = "get">
        <label for = "dept"> 부서명 : </label>
        <input type = "text" name = "dept" placeholder="예:총무부">
        <button type = "submit"> 조회 </button>
    </form>

    <hr>
    
    <h3> 예제1. 직원 목록 </h3>
    {{jikwondata | safe}}
    <!--[6단계] : db에 있는 데이터를 df.to_html()으로 만들어서 웹에 출력받은 df.to_html을 렌더링하기 위해 | safe를 써준다. | safe를 작성하면 인덱스가 빠진 df의 html구조(df.to_html)를 table로 보여준다 -->


    <h3> 예제2. 직급별 연봉 통계 </h3>
    {{statsdata | safe}}


    <h3> 예제3. 부서별 직급별 인원수 </h3>
    {{crossdata | safe}}

</body>
</html>
