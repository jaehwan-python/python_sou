<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>반복문 while</h3>
    <!--
    형태 : 
    초기값 선언
    while(초기값의 범위){
    증가치
    }
    -->

    <script>
        let k = 0;
        while(k < 10){
            k++;
            if(k === 3 || k === 5) continue;
            document.write(k + '')
            if (k === 9) break;
            // 이렇게 탈출한다.
        }
        // || = or, $$ = and를 의미한다. 
    </script>
    
</body>
</html>
