<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--bootstrap제공-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--css를 먼저쓰고 그 뒤에 javascript를 쓴다-->
    <script>
        // 방식1
        /*
        window.onload = () => { // 페이지 전체(html, js, 이미지 등) 로딩 완료 후
            document.querySelector("#btnSend").onclick = chkDataFunc;
            document.querySelector("#btnClear").onclick = clskDataFunc;
        }
            // 이 구조는 사운드와 이미지까지 모두 서버가 클라이언트로 보내기 때문에 속도가 느리다.
        */


        /* 
        C:\Users\사용자명\AppData\Local\Google\Chrome\User Data\Default\Cache\Cache_Data
        요즘 Chrome/edge 캐시는 이미지가 cat.jpg처럼 원래 파일명대로 저장되지 않고, 
        브라우저 내부 캐시 형식으로 저장되는 경우가 많다는 것이다.
        그래서 해당 폴더를 열어도 이미지 파일을 바로 차직 어려울 수 있다.
        */

        
        // 방식2
        document.addEventListener("DOMContentLoaded", () => { // dom생성 완료(이미지 등은 차후) 후
            document.querySelector("#btnSend").onclick = chkDataFunc;
            document.querySelector("#btnClear").onclick = clskDataFunc;
        })
        // 이 구조는 사운드와 이미지는 빼고 서버가 클라이언트로 보내기 때문에 속도가 빠르다.
    
        function chkDataFunc(eevveenntt){
            //alert("a")
            
            eevveenntt.preventDefault() // 기본적으로 제공되는 summit 기능 해제

            // 입력 자료 오류 검사 - 아래 검사 후 이상이 없으면 서버로 자료 전송
            if (frm.name.value === "" || isNaN(frm.name.value) === false){
                // frm의 name의 값이 없거나 혹은 isNaN(Not a Number)이 false라면(=frm.name.value가 숫자라면) 
                // isNaN은 숫자는 False로 숫자가 아니라면 True를 반환한다.
                frm.name.focus(); 
                // frm의 name으로 focus(커서)를 이동한다. 
                alert("이름을 입력하시오. 문자만 허용");
                return; // 함수 탈출

            }

            if(frm.id.value.length < 3){
                frm.id.focus();
                alert("id는 3글자 이상 입력하세요.");
                return;
            }
        
        
            
            // 정규표현식
            let re_str = "123Abc가나다45김 rlawoghks 23 안동"
            console.log(re_str.match(/[1]/));
            console.log(re_str.match(/[1]/g)); // g : global을 의미한다.
            console.log(re_str.match(/[0-9 ]/g));
            console.log(re_str.match(/\d/g));
            console.log(re_str.match(/[0-9]+/g));
            console.log(re_str.match(/[가나]/g));
            console.log(re_str.match(/[가-힣]+/g));
            console.log(re_str.match(/\d{2}/g));
            console.log(re_str.match(/\d{2,3}/g));
            // javascript는 "//"안에 패턴을 집어넣어서 정규표현식을 만든다.


            // < 입력자료 오류 검사 >
            // email 입력 자료 검사
            let email_regex = /[0-9a-zA-Z][_0-9a-zA-Z-]*@[_0-9a-zA-Z-]+(\.[_0-9a-zA-Z-]+){1,2}$/;
            if(!frm.email.value.match(email_regex)){
                frm.email.focus();
                alert("email형식에 맞게 입력하세요.");
                return;}
            // ! : 만약 메일의 형식이 아니라면 아래 alert를 띄움 
        
            // 나이 확인
            let age_regex = /^[0-9]{1,2}$/;
            if(!frm.age.value.match(age_regex)){
                frm.age.focus();
                alert("나이는 숫자만 입력하세요.");
                return;
            }
            //alert("성공")
            frm.action = "my.py";
            frm.method = "get";
            frm.submit();
            // 입력자료 검사 후 이상이 없으면 서버로 자료전송 
        }

        function clskDataFunc(){
            alert("b")
        }
    </script>

    

</head>


<body>
    <h2> **고객 자료 입력** </h2>
    <!--
    <form name = "frm" action = "서버호출명" method = "get"> </form>
    --> 

    <form name = "frm">
        <table class  = "table table-dark table-hover">
            <tr>
                <td> 이 름 </td>
                <td><input type = "text" name = "name" id = "name" value = "신기해"></td>
            </tr>

            <tr>
                <td> 아이디 </td>
                <td><input type = "text" name = "id" id = "id" value = "kor" placeholder = "3글자 이상" value = "good"></td>
            </tr>
            
            <tr>
                <td> 이메일 </td>
                <td><input type = "text" name = "email" id = "email" value = "abs@abc.com"></td>
            </tr>
            
            <tr>
                <td> 나 이 </td>
                <td><input type = "text" name = "age" id = "age"></td>
            </tr>
            
            <tr>
                <td colspan="2" style = "text-align: center;">
                    <input type = "submit" id = "btnSend" value = "자료전송" class = "btn btn-primary">
                    <input type = "reset" id = "btnClear" value = "자료삭제" class = "btn btn-info">
                </td>
            </tr>
        </table>
    </form>


</body>
</html>
